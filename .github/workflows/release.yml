name: Release Extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package Extension Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Une extension qui ne compile pas ne doit pas partir en release : le
      # .zip n'embarque que des sources, personne ne s'en apercevrait avant
      # l'installation.
      - uses: dtolnay/rust-toolchain@1.88
      - name: Verifier que l'extension compile
        run: cargo check --all-targets
      - name: Build Extension Archive (.zip)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          [ -n "$TAG" ] || TAG="1.0.0"
          NAME="${{ github.event.repository.name }}"
          mkdir -p dist
          zip -r "dist/${NAME}-v${TAG}.zip" . -x ".git/*" ".github/*" "target/*" "dist/*"
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: "${{ github.event.repository.name }} ${{ github.ref_name }}"
          files: dist/*.zip
          generate_release_notes: true
