[package]
name = "locaryn-plugin-ssh"
version = "2.0.0"
edition = "2021"
description = "Official Locaryn Extension: Remote SSH AI Agent Connector"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-ssh-mcp"
path = "src/bin/ssh_mcp.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[workspace]
